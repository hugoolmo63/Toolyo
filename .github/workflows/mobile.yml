# Mobile Builds — artefactos nativos Android/iOS (014-app-movil-multiplataforma)
#
# Genera artefactos instalables internos (APK Android y .app/.ipa iOS) sin publicar
# en tiendas. El endpoint se configura con la entrada `server_url` (MOBILE_SERVER_URL).
#
# Secretos opcionales para firmar (nunca se escriben en artefactos ni logs):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#   IOS_TEAM_ID, IOS_EXPORT_METHOD (ad-hoc | development | app-store)
#
# Notificaciones push (opcionales):
#   GOOGLE_SERVICES_JSON (contenido de google-services.json para FCM en Android)
#   La capacidad Push Notifications + APNs se configura en Xcode (iOS).
name: Mobile Builds

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Endpoint del servicio (MOBILE_SERVER_URL). Admite dirección de red local."
        required: true
        type: string
      allow_cleartext:
        description: "Fuerza HTTP en claro. Si el endpoint es http:// local, se activa automáticamente."
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Publicar los artefactos en Releases al terminar."
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Tag del release interno donde publicar (se reutiliza/actualiza)."
        required: false
        default: "mobile-internal"
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  # Capacitor 8 exige Node >= 22 (el resto de workflows pueden seguir en 20).
  NODE_VERSION: "22"
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      MOBILE_SERVER_URL: ${{ inputs.server_url || vars.MOBILE_SERVER_URL || '' }}
    defaults:
      run:
        working-directory: development
    steps:
      - uses: actions/checkout@v4

      - name: Resolve endpoint configuration
        run: |
          set -euo pipefail
          if [ -z "$MOBILE_SERVER_URL" ]; then
            echo "::error::Falta server_url (MOBILE_SERVER_URL): indica el endpoint del servicio."
            exit 1
          fi
          cleartext="${{ inputs.allow_cleartext }}"
          if printf '%s' "$MOBILE_SERVER_URL" | grep -Eq '^http://(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|[a-z0-9-]+\.local)'; then
            cleartext="true"
          fi
          echo "MOBILE_ALLOW_CLEARTEXT=$cleartext" >> "$GITHUB_ENV"
          echo "Endpoint: $MOBILE_SERVER_URL (cleartext=$cleartext)"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: development/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 compila con Java 21 (ver android/app/capacitor.build.gradle).
          java-version: "21"

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-<no definido>}"
          SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager no encontrado; se usa el SDK preinstalado y AGP descargará lo que falte."
            exit 0
          fi
          # Acepta licencias e instala lo que necesita compileSdk/targetSdk 36.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          "$SDKMANAGER" --list_installed 2>/dev/null | sed -n '1,25p' || true

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"; VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Write google-services.json (FCM)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cd android && ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Write build metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIGNED="false"; [ -n "$ANDROID_KEYSTORE_BASE64" ] && SIGNED="true"
          printf 'platform=android\nversion=%s\ndate=%s\nsignature=%s\ncommit=%s\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIGNED" "$GITHUB_SHA" > android/build-metadata.txt
          cat android/build-metadata.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolyo-android-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            development/android/app/build/outputs/apk/**/*.apk
            development/android/build-metadata.txt

  ios:
    name: iOS App
    # Capacitor 8 requiere Xcode 16+; macos-15 lo trae por defecto.
    runs-on: macos-15
    env:
      MOBILE_SERVER_URL: ${{ inputs.server_url || vars.MOBILE_SERVER_URL || '' }}
      MOBILE_IOS_ASSOCIATED_DOMAIN: ${{ vars.MOBILE_IOS_ASSOCIATED_DOMAIN || '' }}
    defaults:
      run:
        working-directory: development
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          set -euo pipefail
          echo "Xcode por defecto:"; xcodebuild -version || true
          XCODE_APP="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          echo "Xcode en uso:"; xcodebuild -version

      - name: Resolve endpoint configuration
        run: |
          set -euo pipefail
          if [ -z "$MOBILE_SERVER_URL" ]; then
            echo "::error::Falta server_url (MOBILE_SERVER_URL): indica el endpoint del servicio."
            exit 1
          fi
          cleartext="${{ inputs.allow_cleartext }}"
          if printf '%s' "$MOBILE_SERVER_URL" | grep -Eq '^http://(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|[a-z0-9-]+\.local)'; then
            cleartext="true"
          fi
          echo "MOBILE_ALLOW_CLEARTEXT=$cleartext" >> "$GITHUB_ENV"
          echo "Endpoint: $MOBILE_SERVER_URL (cleartext=$cleartext)"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: development/package-lock.json

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"; VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Configure Universal Links domain
        if: env.MOBILE_IOS_ASSOCIATED_DOMAIN != ''
        run: |
          sed -i '' "s|applinks:toolyo.example.com|applinks:$MOBILE_IOS_ASSOCIATED_DOMAIN|g" ios/App/App/App.entitlements
          cat ios/App/App/App.entitlements

      - name: Build simulator app (unsigned)
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build signed IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/toolyo.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/toolyo.mobileprovision
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -archivePath "$PWD/build/App.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" archive
          cat > "$PWD/build/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${IOS_EXPORT_METHOD:-development}</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -exportPath "$PWD/build/ipa"

      - name: Write build metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIGNED="false"; [ -n "$IOS_CERTIFICATE_BASE64" ] && SIGNED="true"
          printf 'platform=ios\nversion=%s\ndate=%s\nsignature=%s\ncommit=%s\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIGNED" "$GITHUB_SHA" > ios/build-metadata.txt
          cat ios/build-metadata.txt

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolyo-ios-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            development/ios/App/build/ipa/**/*.ipa
            development/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
            development/ios/build-metadata.txt

  release:
    name: Publish artifacts to release
    needs: [android, ios]
    # Publica si al menos una plataforma compiló, aunque la otra falle.
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') && (startsWith(github.ref, 'refs/tags/') || inputs.publish_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # En tags se adjunta al release de la versión; en ejecución manual se
          # publica/actualiza un release interno reutilizable.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Mobile interno ({0})', inputs.release_tag) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: false
          files: artifacts/**/*
