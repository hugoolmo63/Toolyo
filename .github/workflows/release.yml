# Release — build y publish de imagen Docker a GHCR por git tag SemVer
# Ver docs/09-entornos-y-despliegue.md §5.2
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    outputs:
      digest: ${{ steps.meta.outputs.version }}
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/toolyo" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: development
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: echo "sha=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}

  github-release:
    name: Create GitHub Release
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute migrations hash
        id: migrations
        working-directory: development
        run: |
          HASH=$(find prisma/migrations -type f -name "*.sql" | sort | xargs cat | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-image.outputs.tag }}
          name: ${{ needs.build-image.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Artefacto

            **Imagen Docker:** `ghcr.io/${{ github.repository_owner }}/toolyo:${{ needs.build-image.outputs.version }}`

            **Digest SHA256:** `${{ needs.build-image.outputs.digest }}`

            **Hash migraciones Prisma:** `${{ steps.migrations.outputs.hash }}`

            ---

            Para desplegar esta versión, usa el repo `Toolyo-deploy` con:
            ```yaml
            workflow_dispatch:
              inputs:
                version: "${{ needs.build-image.outputs.version }}"
            ```
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
