# CI — validación continua en cada push/PR
# Ver docs/09-entornos-y-despliegue.md §5.1
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: development/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      STORAGE_PROVIDER: local
      STORAGE_PUBLIC_BASE_URL: http://localhost:3000/uploads
      STORAGE_BUCKET: toolyo-test
      STORAGE_REGION: test
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: test-access-key
      STORAGE_SECRET_ACCESS_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: development/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm test

  test-integration:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    env:
      NODE_ENV: test
      CI: true
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_CHECKS_DISABLE: "true"
      TEST_POSTGRES_IMAGE: toolyo-postgres:15-pgvector-postgis
      STORAGE_PROVIDER: local
      STORAGE_PUBLIC_BASE_URL: http://localhost:3000/uploads
      STORAGE_BUCKET: toolyo-test
      STORAGE_REGION: test
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: test-access-key
      STORAGE_SECRET_ACCESS_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: development/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Build PostgreSQL test image
        working-directory: .
        run: docker build --tag toolyo-postgres:15-pgvector-postgis --file scripts/Dockerfile.postgres-test scripts

      - name: Verify PostgreSQL test extensions
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container_name=toolyo-postgres-extension-check
          docker rm -f "$container_name" >/dev/null 2>&1 || true
          docker run --detach --name "$container_name" \
            --env POSTGRES_USER=test \
            --env POSTGRES_PASSWORD=test \
            --env POSTGRES_DB=test \
            toolyo-postgres:15-pgvector-postgis >/dev/null
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_name" pg_isready -U test -d test >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$container_name" psql -v ON_ERROR_STOP=1 -U test -d test -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS postgis; SELECT extname FROM pg_extension WHERE extname IN ('vector', 'pg_trgm', 'postgis') ORDER BY extname;"

      - run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
