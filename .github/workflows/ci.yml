# CI — validación continua en cada push/PR
# Ver docs/09-entornos-y-despliegue.md §5.1
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: development/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: development/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm test

  test-integration:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: development/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
